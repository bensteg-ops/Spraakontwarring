<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spraakontwarring</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="authScreen" class="auth-screen hidden">
  <div class="auth-card">
    <h1>🎙️ Spraakontwarring</h1>
    <p class="auth-subtitle">Log in of maak een gratis account aan. Je opnames zijn privé — alleen jij ziet ze.</p>

    <div class="auth-tabs">
      <button id="authTabLogin" class="auth-tab active">Inloggen</button>
      <button id="authTabRegister" class="auth-tab">Account aanmaken</button>
    </div>

    <form id="loginForm" class="auth-form">
      <input id="loginEmail" type="email" placeholder="E-mailadres" required autocomplete="username" />
      <input id="loginPassword" type="password" placeholder="Wachtwoord" required autocomplete="current-password" />
      <button type="submit" class="auth-submit">Inloggen</button>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <input id="registerName" type="text" placeholder="Je naam (optioneel)" autocomplete="name" />
      <input id="registerEmail" type="email" placeholder="E-mailadres" required autocomplete="username" />
      <input id="registerPassword" type="password" placeholder="Wachtwoord (minstens 8 tekens)" required autocomplete="new-password" />
      <button type="submit" class="auth-submit">Account aanmaken</button>
    </form>

    <div id="authError" class="auth-error"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🎙️ Spraakontwarring</h1>
      <div class="user-bar">
        <span id="userNameLabel"></span>
        <button id="logoutBtn" class="logout-btn">Uitloggen</button>
      </div>
    </div>

    <div class="record-box">
      <button id="recordBtn" class="record-btn">
        <span class="dot"></span>
        <span id="recordLabel">Opname starten</span>
      </button>
      <div id="timer" class="timer">00:00</div>

      <div class="or-divider"><span>of</span></div>

      <label class="upload-label">
        📁 Bestand uploaden
        <input id="fileInput" type="file" accept="audio/*,video/*" hidden />
      </label>

      <div class="new-meta">
        <input id="titleInput" type="text" placeholder="Titel van vergadering (optioneel)" />
        <select id="langSelect">
          <option value="nl">Nederlands</option>
          <option value="en">Engels</option>
          <option value="auto">Automatisch detecteren</option>
        </select>
      </div>
    </div>

    <div class="profiles-box">
      <div class="profiles-header">
        <strong>🗣️ Stemprofielen</strong>
        <span id="profilesHint" class="hint"></span>
      </div>
      <ul id="profileList" class="profile-list"></ul>
      <div class="profile-add">
        <input id="profileNameInput" type="text" placeholder="Naam van de spreker" />
        <div class="profile-add-buttons">
          <button id="profileRecordBtn" class="mini-btn">🎙️ Opnemen</button>
          <label class="mini-btn upload-mini">
            📁 Upload
            <input id="profileFileInput" type="file" accept="audio/*" hidden />
          </label>
        </div>
        <div id="profileRecordStatus" class="profile-record-status"></div>
      </div>
    </div>

    <div class="list-header">Eerdere opnames</div>
    <ul id="recordingList" class="recording-list"></ul>
  </aside>

  <main class="content">
    <div id="emptyState" class="empty-state">
      <p>Selecteer een opname of start een nieuwe opname links.</p>
    </div>

    <div id="detail" class="detail hidden">
      <header class="detail-header">
        <button id="backToListBtn" class="icon-btn back-btn" title="Terug naar opnames">← Terug</button>
        <input id="detailTitle" class="detail-title-input" />
        <span id="statusBadge" class="status-badge"></span>
        <button id="deleteBtn" class="icon-btn" title="Opname verwijderen">🗑️</button>
      </header>

      <audio id="player" controls class="player"></audio>

      <nav class="tabs">
        <button class="tab-btn active" data-tab="transcript">Transcript</button>
        <button class="tab-btn" data-tab="minutes">Notulen</button>
        <button class="tab-btn" data-tab="mindmap">Mindmap</button>
      </nav>

      <section id="tab-transcript" class="tab-panel active">
        <div class="speaker-editor" id="speakerEditor"></div>
        <div id="transcriptView" class="transcript-view"></div>
      </section>

      <section id="tab-minutes" class="tab-panel">
        <div class="panel-toolbar">
          <button id="regenerateBtn" class="secondary-btn">🔄 Opnieuw genereren</button>
          <button id="copyMinutesBtn" class="secondary-btn">📋 Kopiëren</button>
          <button id="exportDocxBtn" class="secondary-btn">⬇️ Word</button>
          <button id="exportPdfBtn" class="secondary-btn">⬇️ PDF</button>
        </div>
        <div id="minutesView" class="minutes-view"></div>
      </section>

      <section id="tab-mindmap" class="tab-panel">
        <div class="panel-toolbar">
          <button id="downloadMindmapBtn" class="secondary-btn">⬇️ SVG downloaden</button>
        </div>
        <div id="mindmapView" class="mindmap-view"></div>
      </section>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
